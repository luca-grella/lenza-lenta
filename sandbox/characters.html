<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Characters sandbox — Lenza Lenta 2</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
  { "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/addons/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9e4f2; font: 13px/1.35 system-ui, -apple-system, sans-serif; color: #17324a; touch-action: none; }
    #game { position: fixed; inset: 0; }
    #panel { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); width: 300px; max-height: calc(100% - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow: auto; background: rgba(255, 252, 244, .92); border-radius: 14px; box-shadow: 0 6px 24px rgba(20, 50, 70, .25); padding: 10px 12px; box-sizing: border-box; touch-action: pan-y; }
    #panel.collapsed > :not(#toggle) { display: none; }
    #panel.collapsed { width: auto; padding: 6px; background: transparent; box-shadow: none; }
    #toggle { position: sticky; top: 0; float: right; border: 0; background: #1d6f9a; color: #fff; border-radius: 8px; padding: 3px 9px; cursor: pointer; }
    h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #1d6f9a; }
    h3:first-of-type { margin-top: 2px; }
    label { display: grid; grid-template-columns: 78px 1fr 40px; align-items: center; gap: 6px; margin: 3px 0; }
    label.chk { grid-template-columns: 18px 1fr; }
    input[type=range] { width: 100%; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    button.b { border: 1px solid #b9d7e2; background: #fff; border-radius: 7px; padding: 3px 7px; cursor: pointer; font-size: 12px; color: #17324a; }
    button.b.on { background: #1d6f9a; color: #fff; border-color: #1d6f9a; }
    #stats { font: 11px/1.3 ui-monospace, Menlo, monospace; white-space: pre; color: #345; }
    select { width: 100%; }
    #hint { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); background: rgba(255,252,244,.85); border-radius: 10px; padding: 6px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="panel">
    <button id="toggle">–</button>
    <h3>Who</h3>
    <div class="row" id="who"></div>
    <h3>Clips</h3>
    <div class="row"><label class="chk"><input id="loop" type="checkbox"><span>force loop</span></label><label class="chk"><input id="upper" type="checkbox"><span>upper layer</span></label></div>
    <label>speed <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1"><span id="speedV">1</span></label>
    <div class="row" id="clips"></div>
    <div class="row"><button class="b" id="nod">+ nod (additive)</button><button class="b" id="flinch">+ flinch (additive)</button><button class="b" id="locomotion">back to locomotion</button></div>
    <h3>View</h3>
    <div class="row" id="views"></div>
    <h3>Procedural</h3>
    <label>rod bend <input id="bend" type="range" min="0" max="1.2" step="0.01" value="0"><span id="bendV">0</span></label>
    <label class="chk"><input id="lookOn" type="checkbox"><span>look at the orange ball (drag: arrows move it)</span></label>
    <label class="chk"><input id="fish" type="checkbox"><span>hold a fish</span></label>
    <div class="row"><button class="b" id="sit">sit on the dock edge</button><button class="b" id="stand">stand up</button><button class="b" id="hills">go to the bumps</button><button class="b" id="home">go home</button></div>
    <h3>Time</h3>
    <label>hour <input id="hour" type="range" min="0" max="24" step="0.1" value="11"><span id="hourV"></span></label>
    <h3>Stats</h3>
    <div id="stats"></div>
  </div>
  <div id="hint">WASD / arrows walk · Shift = slow walk · E wave</div>
  <script type="module">
    import { createCore } from '../src/core/index.js';
    const ctx = await createCore({ canvasParent: document.getElementById('game'), debug: true });
    const { THREE } = ctx;
    const stage = ctx.createTestStage({ ground: true, dummy: false });
    try { const d = await import('../src/data/index.js'); await d.loadData?.(ctx); } catch (e) { console.info('[sandbox] data not loaded', e?.message); }

    // ---- bench terrain: flat lawn, a bumpy patch (x > 5), and a small dock (for sitting on an edge) ----
    const bumps = (x, z) => { const k = Math.max(0, Math.min(1, (x - 5) / 2)); return k * (0.35 * Math.sin(x * 1.3) * Math.cos(z * 1.1) + 0.25 * Math.sin(x * 0.7 + z * 0.9) + 0.25); };
    const dock = { x0: -7.5, x1: -4.5, z0: -2, z1: 2, y: 0.55 };
    const onDock = (x, z) => x > dock.x0 && x < dock.x1 && z > dock.z0 && z < dock.z1;
    const heightAt = (x, z) => bumps(x, z);
    const groundY = (x, z) => (onDock(x, z) ? dock.y : heightAt(x, z));
    {
      const g = new THREE.PlaneGeometry(16, 16, 96, 96).rotateX(-Math.PI / 2); g.translate(10, 0, 0);
      const p = g.attributes.position, c = new Float32Array(p.count * 3), a = new THREE.Color(0x86c454), b = new THREE.Color(0x6fb548);
      for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, heightAt(x, z) + 0.002); const t = 0.5 + 0.5 * Math.sin(x * 2.1 + z * 1.7); const cc = a.clone().lerp(b, t); c.set([cc.r, cc.g, cc.b], i * 3); }
      g.setAttribute('color', new THREE.BufferAttribute(c, 3)); g.computeVertexNormals();
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 })); m.receiveShadow = true; stage.group.add(m);
      const dk = new THREE.Mesh(new THREE.BoxGeometry(dock.x1 - dock.x0, 0.12, dock.z1 - dock.z0), new THREE.MeshStandardMaterial({ color: 0xb07a4a, roughness: 0.85 }));
      dk.position.set((dock.x0 + dock.x1) / 2, dock.y - 0.06, 0); dk.castShadow = dk.receiveShadow = true; stage.group.add(dk);
      for (const [x, z] of [[dock.x0 + 0.2, -1.8], [dock.x0 + 0.2, 1.8], [dock.x1 - 0.2, -1.8], [dock.x1 - 0.2, 1.8]]) { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0x8a5532 })); post.position.set(x, 0.0, z); post.castShadow = true; stage.group.add(post); }
      const water = new THREE.Mesh(new THREE.CircleGeometry(3.2, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3fd0c9, roughness: 0.3 })); water.position.set(-9.5, 0.01, 0); stage.group.add(water);
    }
    // a tiny World stub (only for this bench): ground + walls of the dock posts are ignored
    ctx.world = { heightAt, groundY, waterLevel: -10, resolveMove: (f, t) => ({ x: t.x, y: groundY(t.x, t.z), z: t.z, blocked: false }),
      poi: (id) => ({ dock_edge: { x: dock.x0 + 0.25, z: 0, facing: -Math.PI / 2, y: dock.y, kind: 'edge' } })[id] || null,
      spawn: { x: 0, z: 2, facing: 0 } };

    const P = await import('../src/actors/player.js');
    ctx.player = await P.init(ctx);
    ctx.cameraRig.follow(ctx.player.object); ctx.cameraRig.snap();
    try { const N = await import('../src/actors/npc.js'); ctx.npcs = await N.init(ctx, { sandbox: true }); } catch (e) { console.info('[sandbox] npc module not available yet', e?.message); }

    // ---- look-at ball + fake fish ----
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), new THREE.MeshStandardMaterial({ color: 0xff8a3a, emissive: 0x803000 }));
    ball.position.set(2.5, 1.6, 3); ctx.scene.add(ball);
    const fish = new THREE.Group();
    { const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12), new THREE.MeshStandardMaterial({ color: 0x5a8ac8, roughness: 0.5 })); body.scale.set(0.32, 0.45, 1); fish.add(body);
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.3, 3), new THREE.MeshStandardMaterial({ color: 0x3a6aa8 })); tail.rotation.x = -Math.PI / 2; tail.position.z = -0.6; tail.scale.set(0.3, 1, 1.4); fish.add(tail);
      fish.scale.setScalar(0.55); fish.traverse(o => { o.castShadow = true; }); }

    // ---- who: player or a villager ----
    let who = ctx.player;
    const whoRow = document.getElementById('who');
    const targets = [{ id: 'player', a: ctx.player }, ...((ctx.npcs?.list) || []).map(n => ({ id: n.id, a: n }))];
    for (const t of targets) {
      const b = document.createElement('button'); b.className = 'b' + (t.a === who ? ' on' : ''); b.textContent = t.id;
      b.onclick = () => { who = t.a; [...whoRow.children].forEach(x => x.classList.toggle('on', x === b)); ctx.cameraRig.follow(who.object); setView(view); };
      whoRow.appendChild(b);
    }

    // ---- clips ----
    const clipsRow = document.getElementById('clips');
    const names = ctx.player.clips();
    const play = (n) => {
      const loop = document.getElementById('loop').checked ? true : undefined;
      const layer = document.getElementById('upper').checked ? 'upper' : undefined;
      const sp = +document.getElementById('speed').value;
      return (who.play || who.character.play)(n, { loop, layer, speed: sp, fade: 0.25 });
    };
    for (const n of names) { const b = document.createElement('button'); b.className = 'b'; b.textContent = n; b.onclick = () => play(n); clipsRow.appendChild(b); }
    document.getElementById('speed').oninput = e => document.getElementById('speedV').textContent = e.target.value;
    document.getElementById('nod').onclick = () => (who.character || who).animator.playAdditive('nod');
    document.getElementById('flinch').onclick = () => (who.character || who).animator.playAdditive('flinch');
    document.getElementById('locomotion').onclick = () => { if (who.setState) who.setState('idle'); else who.play('locomotion'); };

    // ---- views ----
    let view = 'game';
    const views = { game: 'game cam', side: 'side', front: 'front', back: 'back', close: 'close-up', top: 'top' };
    const vRow = document.getElementById('views');
    function setView(v) {
      view = v; [...vRow.children].forEach(x => x.classList.toggle('on', x.dataset.v === v));
      const o = who.object, p = o.getWorldPosition(new THREE.Vector3()), f = who.facing ?? o.rotation.y;
      const fwd = new THREE.Vector3(Math.sin(f), 0, Math.cos(f)), side = new THREE.Vector3(fwd.z, 0, -fwd.x);
      const at = p.clone().add(new THREE.Vector3(0, 0.95, 0));
      const shot = (dir, dist, h, fov = 34) => ctx.cameraRig.setShot({ position: at.clone().addScaledVector(dir, dist).add(new THREE.Vector3(0, h, 0)), lookAt: at, fov });
      if (v === 'game') { ctx.cameraRig.setMode('explore'); }
      else if (v === 'side') shot(side.clone().negate(), 5.2, 0.25);
      else if (v === 'front') shot(fwd, 5.2, 0.5);
      else if (v === 'back') shot(fwd.clone().negate(), 5.2, 0.9);
      else if (v === 'top') shot(new THREE.Vector3(0, 0, 1), 0.01, 6.5, 40);
      else if (v === 'close') ctx.cameraRig.setMode('dialog');
      ctx.cameraRig.snap();
    }
    for (const [k, l] of Object.entries(views)) { const b = document.createElement('button'); b.className = 'b'; b.dataset.v = k; b.textContent = l; b.onclick = () => setView(k); vRow.appendChild(b); }

    // ---- procedural toggles ----
    const bend = document.getElementById('bend');
    bend.oninput = () => { document.getElementById('bendV').textContent = bend.value; ctx.player.rod.setBend(+bend.value); ctx.player.rod.setPull(ball.position); };
    document.getElementById('lookOn').onchange = e => { const on = e.target.checked; (who.lookAt || (p => who.character.setLook(p)))(on ? ball : null); };
    document.getElementById('fish').onchange = e => { (who.holdFish)(e.target.checked ? fish : null); };
    document.getElementById('sit').onclick = () => ctx.player.sitAt('dock_edge');
    document.getElementById('stand').onclick = () => ctx.player.standUp();
    document.getElementById('hills').onclick = () => ctx.player.teleport(9, 0, Math.PI / 2);
    document.getElementById('home').onclick = () => ctx.player.teleport(0, 2, 0);
    window.addEventListener('keydown', e => {
      if (e.code === 'KeyE') ctx.player.play('wave');
      const k = { KeyI: [0, -0.3], KeyK: [0, 0.3], KeyJ: [-0.3, 0], KeyL: [0.3, 0] }[e.code];
      if (k) { ball.position.x += k[0]; ball.position.z += k[1]; }
    });
    const hour = document.getElementById('hour');
    ctx.time.paused = true; ctx.time.set(11);
    hour.oninput = () => { ctx.time.set(+hour.value); document.getElementById('hourV').textContent = (+hour.value).toFixed(1); };
    document.getElementById('toggle').onclick = () => document.getElementById('panel').classList.toggle('collapsed');
    setInterval(() => {
      const a = (who.character || who).animator, i = ctx.debug.info();
      document.getElementById('stats').textContent = `state ${who.state ?? '-'}  seated ${who.seated ?? '-'}\nbase ${a?.current}  upper ${a?.upperName}\nspeed ${(who.speed ?? 0).toFixed(2)}  calls ${i.calls}  tris ${i.triangles}\nfps ${ctx.loop.fps?.toFixed?.(0)}`;
    }, 300);

    // debug hooks for tools/strip.mjs scenarios
    window.__chars = { ctx, get who() { return who; }, set who(a) { who = a; ctx.cameraRig.follow(a.object); }, setView, play, ball, fish, targets };
    ctx.loop.start();
    ctx.bus.emit('game:ready');
  </script>
</body>
</html>
