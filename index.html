<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a9e4f2">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lenza Lenta">
  <meta name="application-name" content="Lenza Lenta">
  <meta name="description" content="Un gioco di pesca rilassante, senza fretta. A cozy fishing game.">
  <title>Lenza Lenta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/sheets.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
  <style>
    /* boot splash (shown until the game is ready; the UI title screen takes over) */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10;
      background: radial-gradient(120% 90% at 50% 40%, #d6f4f6 0%, #a9e4f2 50%, #6cc9d8 100%); color: #1d4f6a;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
    #boot .title { font-size: clamp(40px, 11vw, 72px); font-weight: 900; letter-spacing: .5px; color: #fff8ea;
      text-shadow: 0 2px 0 #4b3221, 0 -2px 0 #4b3221, 2px 0 0 #4b3221, -2px 0 0 #4b3221, 0 6px 0 #8a5532, 0 8px 0 #4b3221; }
    #boot .sub { font-size: 15px; font-weight: 700; opacity: .8; min-height: 1.2em; }
    #boot .bob { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(#e8604a 50%, #fff6e4 50%); border: 2.5px solid #4b3221;
      animation: bob 1.8s ease-in-out infinite; }
    #boot .ripple { width: 60px; height: 10px; margin-top: -8px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); animation: rip 1.8s ease-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(7px) } }
    @keyframes rip { 0% { transform: scale(.5); opacity: 1 } 100% { transform: scale(1.4); opacity: 0 } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div class="title">Lenza Lenta</div><div class="bob"></div><div class="ripple"></div><div class="sub" id="boot-msg"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
