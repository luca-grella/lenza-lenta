<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b0"/>
      <stop offset=".55" stop-color="#bfeef0"/>
      <stop offset="1" stop-color="#8fdde6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fcfd0"/>
      <stop offset=".6" stop-color="#25a9b8"/>
      <stop offset="1" stop-color="#147e98"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e9b552"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#f0c060"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="370" cy="150" r="120" fill="url(#sun)"/>
  <!-- sea -->
  <path d="M0 300 Q64 284 128 300 T256 300 T384 300 T512 300 V512 H0Z" fill="url(#sea)"/>
  <path d="M0 300 Q64 284 128 300 T256 300 T384 300 T512 300" fill="none" stroke="#e9fbf8" stroke-width="9" stroke-linecap="round"/>
  <g fill="none" stroke="#bff3ee" stroke-width="7" stroke-linecap="round" opacity=".75">
    <path d="M70 372 q22 -9 44 0"/><path d="M392 404 q24 -10 48 0"/><path d="M120 446 q20 -8 40 0"/>
  </g>
  <!-- bobber with ripples -->
  <g transform="translate(332 362)">
    <ellipse cx="0" cy="10" rx="62" ry="14" fill="none" stroke="#e9fbf8" stroke-width="6" opacity=".55"/>
    <ellipse cx="0" cy="8" rx="38" ry="9" fill="none" stroke="#ffffff" stroke-width="6" opacity=".85"/>
    <line x1="0" y1="-62" x2="0" y2="-34" stroke="#4b3221" stroke-width="6" stroke-linecap="round"/>
    <path d="M-26 -12 A26 26 0 0 1 26 -12 Z" fill="#ec5f48" stroke="#4b3221" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-26 -12 A26 26 0 0 0 26 -12 Z" fill="#fff6e4" stroke="#4b3221" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="-9" cy="-24" r="5" fill="#fff" opacity=".7"/>
  </g>
  <!-- fishing line from hat brim tip to bobber -->
  <path d="M380 150 Q 400 230 332 300" fill="none" stroke="#4b3221" stroke-width="3" opacity=".55"/>
  <!-- straw hat -->
  <g transform="translate(236 228) rotate(-8)">
    <ellipse cx="0" cy="34" rx="168" ry="50" fill="#2f5f6a" opacity=".22"/>
    <ellipse cx="0" cy="22" rx="168" ry="52" fill="url(#straw)" stroke="#4b3221" stroke-width="9"/>
    <g fill="none" stroke="#c98d36" stroke-width="5" stroke-linecap="round" opacity=".7">
      <ellipse cx="0" cy="22" rx="138" ry="40"/>
      <ellipse cx="0" cy="22" rx="108" ry="30"/>
    </g>
    <path d="M-86 18 C-84 -58 -48 -92 0 -92 C48 -92 84 -58 86 18 C40 34 -40 34 -86 18Z" fill="url(#crown)" stroke="#4b3221" stroke-width="9" stroke-linejoin="round"/>
    <path d="M-86 4 C-40 22 40 22 86 4 L86 22 C40 38 -40 38 -86 22Z" fill="#e2563f" stroke="#4b3221" stroke-width="7" stroke-linejoin="round"/>
    <g fill="none" stroke="#c98d36" stroke-width="5" stroke-linecap="round" opacity=".6">
      <path d="M-62 -26 C-30 -16 30 -16 62 -26"/>
      <path d="M-48 -58 C-20 -50 20 -50 48 -58"/>
    </g>
    <path d="M-52 -66 C-40 -80 -20 -86 -4 -86" fill="none" stroke="#fff6e4" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
